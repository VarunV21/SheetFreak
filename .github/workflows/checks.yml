name: Source and packaging checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_source.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - name: Parse installer without running Excel
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$pwd/install/Install-SheetFreak.ps1", [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
